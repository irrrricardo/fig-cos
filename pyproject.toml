[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fig-cos"
version = "0.1.0"
description = "Companion runtime for the fig-cos scientific figure Agent Skill"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "skills/fig-cos/scripts/vendor/LICENSE", "skills/fig-cos/assets/icon-library/LUCIDE-LICENSE.txt"]
authors = [{name = "irrrricardo"}]
keywords = ["agent-skills", "scientific-figures", "svg", "powerpoint", "vectorization"]
dependencies = ["vtracer==0.6.12", "Pillow>=10,<13", "python-pptx>=1.0,<2", "fonttools>=4.50,<5", "picosvg==0.23.0", "cssselect2>=0.7,<1", "tinycss2>=1.2,<2", "skia-pathops>=0.9,<1", "CairoSVG>=2.7,<3", "lxml>=4.9,<7"]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24,<2"]
powerpoint = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["build>=1,<2", "PyYAML>=6,<7"]

[project.scripts]
fig-cos = "fig_cos.cli:main"

[project.urls]
Homepage = "https://github.com/irrrricardo/fig-cos"
Issues = "https://github.com/irrrricardo/fig-cos/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fig_cos"]

[tool.setuptools.package-data]
fig_cos = ["skills/fig-cos/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]
